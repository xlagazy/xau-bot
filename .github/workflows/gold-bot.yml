name: XAU alert bot

on:
  # ไม่ใช้ schedule ของ GitHub แล้ว (ช้า/ข้ามรอบบ่อย)
  # ตอนนี้ cron-job.org เป็นตัวสั่งรันผ่าน GitHub API ด้วย mode=auto
  # ตารางเดิม: นาทีที่ 0 ชั่วโมง 0–18 UTC วันจันทร์–ศุกร์ (= 07:00–01:00 น. เวลาไทย)
  workflow_dispatch:
    inputs:
      mode:
        description: "full = ส่งข้อความเต็มเสมอ / auto = ทำตามตาราง (เต็มตอน 07/20 น. นอกนั้นเฉพาะ 🟢/🔴)"
        type: choice
        options: [full, auto]
        default: full

# กันรันซ้อนกันถ้า cron ยิงซ้ำในเวลาใกล้กัน
concurrency:
  group: xau-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python gold_bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ONLY_SIGNALS: "false"   # "true" = ส่งเฉพาะรอบที่มีสัญญาณทุกรอบ รวมถึง 07:00/20:00
          FULL_HOURS: "7,20"      # ชั่วโมงเวลาไทยที่ส่งข้อความเต็ม
          RUN_MODE: ${{ inputs.mode }}
          # โหมดถือของ: ตั้งใน Settings → Secrets and variables → Actions → Variables
          # ENTRY_PRICE ว่าง = หาจังหวะซื้อ / ใส่ราคาซื้อ = บอกว่าขายได้หรือยัง
          ENTRY_PRICE: ${{ vars.ENTRY_PRICE }}
          BUY_DATE: ${{ vars.BUY_DATE }}
          TAKE_PROFIT: ${{ vars.TAKE_PROFIT }}
          STOP_ATR: ${{ vars.STOP_ATR }}
          TRAIL_ATR: ${{ vars.TRAIL_ATR }}
